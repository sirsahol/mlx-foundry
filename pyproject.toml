[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-foundry"
version = "0.1.0"
description = "A professional CLI pipeline for converting, benchmarking, and publishing HuggingFace models to Apple MLX format."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "SirSahOl" },
]
keywords = ["mlx", "apple-silicon", "model-conversion", "quantization", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx-lm>=0.20.0",
    "huggingface-hub>=0.25.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
mlx-foundry = "mlx_foundry.cli:app"

[project.urls]
Homepage = "https://github.com/SirSahOl/mlx-foundry"
Repository = "https://github.com/SirSahOl/mlx-foundry"
Issues = "https://github.com/SirSahOl/mlx-foundry/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_foundry"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
